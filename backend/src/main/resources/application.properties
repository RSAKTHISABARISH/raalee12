spring.application.name=helpdesk360

# Server
server.port=${SERVER_PORT:8080}

# SQLite Database
spring.datasource.url=jdbc:sqlite:${DB_PATH:./helpdesk360.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable open-in-view
spring.jpa.open-in-view=false

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4321,http://localhost:3000}

# Security
app.jwt.secret=${JWT_SECRET:helpdesk360-dev-secret-key-change-in-production-min-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Logging
logging.level.com.helpdesk360=INFO
logging.level.org.springframework.security=WARN

